name: Date markup probe
on:
  push:
    branches: [diagnose/date-markup]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/date_markup_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: date-markup-probe
          path: date-probe/
          retention-days: 3
