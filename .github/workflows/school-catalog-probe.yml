name: Diagnose school catalog
on:
  push:
    branches: [diagnose/school-catalog]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          mkdir -p /tmp/catalog-classes
          javac -encoding UTF-8 -d /tmp/catalog-classes app/src/main/java/kr/personal/historyjobs/core/*.java tools/SchoolCatalogCheck.java
          java -cp /tmp/catalog-classes SchoolCatalogCheck hansung-science gwacheon-fl myungduk-fl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: school-catalog-diagnostics
          path: catalog-live/
