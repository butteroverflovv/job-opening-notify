name: Diagnose school catalog
on:
  push:
    branches: [diagnose/school-catalog]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/school_catalog_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: school-catalog-diagnostics
          path: school-catalog-diagnostics/
