name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore personal test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: history-jobs-debug-signing-v1-${{ github.repository_id }}
      - name: Test collector and document readers
        run: python3 tools/test_core.py
      - name: Probe public source boards
        continue-on-error: true
        run: python3 tools/probe_sources.py
      - name: Build and lint
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:lintDebug
          cp app/build/outputs/apk/debug/app-debug.apk history-jobs-0.1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: history-jobs-0.1.0-apk
          path: history-jobs-0.1.0.apk
          retention-days: 30
      - name: Save build and source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-jobs-diagnostics
          path: |
            diagnostics/
            app/build/reports/lint-results-debug.*
          retention-days: 7
