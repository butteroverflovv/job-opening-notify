name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore personal test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: history-jobs-debug-signing-v1-${{ github.repository_id }}
      - name: Test collector and document readers
        run: python3 tools/test_core.py
      - name: Build and lint
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:lintDebug
          cp app/build/outputs/apk/debug/app-debug.apk history-jobs-0.1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: history-jobs-0.1.0-apk
          path: history-jobs-0.1.0.apk
          retention-days: 30
